[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "merit-badge-workbook"
version = "1.1.0"
description = "Printable requirement checklists, workbooks and blue cards for Scouting America merit badges"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
]

[project.optional-dependencies]
pdf = ["reportlab>=4.0"]
gui = ["PySide6>=6.6"]
# Filling a council's fillable blue card PDF. The template is not shipped.
cards = ["pypdf>=4.0"]
app = ["reportlab>=4.0", "PySide6>=6.6", "pypdf>=4.0"]
dev = ["pytest>=7.0", "reportlab>=4.0", "PySide6>=6.6", "pypdf>=4.0"]

[project.scripts]
mbworkbook = "mbworkbook.cli:main"

[project.gui-scripts]
mbworkbook-gui = "mbworkbook.gui:main"

[tool.setuptools.packages.find]
include = ["mbworkbook*"]

[tool.setuptools.package-data]
# The prebuilt requirements snapshot ships inside the package.
mbworkbook = ["data/*.json"]
